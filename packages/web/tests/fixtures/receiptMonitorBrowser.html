<!doctype html><html><head><meta charset="utf-8"><title>Receipt monitor tests</title></head><body><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { AuthProvider } from '../../src/contexts/AuthContext.jsx';
import { SettingsProvider } from '../../src/contexts/SettingsContext.jsx';
import ReceiptMonitor from '../../src/components/settings/ReceiptMonitor.jsx';
import '../../src/index.css';
const root = createRoot(document.getElementById('root'));
let count = 0;
window.mountMonitor = (permissions = null) => {
    localStorage.setItem('userSession', JSON.stringify({ token: 'fixture', user: { employee_id: 1, permission_level_id: permissions ? 1 : 10 }, permissions: permissions || [] }));
    window.spoiled = null; window.corrected = null;
    root.render(React.createElement(AuthProvider, { key: ++count }, React.createElement(SettingsProvider, null,
        React.createElement(ReceiptMonitor, { seriesList: [
            { series_id: 1, name: 'Booklet', prefix: 'SI' }, { series_id: 2, name: 'Unbounded', prefix: 'UB' }, { series_id: 3, name: 'Other booklet', prefix: 'OT' }],
        onSpoil: row => { window.spoiled = row; }, onCorrect: row => { window.corrected = row; } }))));
};
</script></body></html>
