<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body class="bg-gray-50 dark:bg-slate-900 p-4">
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { AuthProvider } from '../../src/contexts/AuthContext.jsx';
    import ChequePrintingPage from '../../src/pages/ChequePrintingPage.jsx';
    import '../../src/index.css';

    const root = createRoot(document.getElementById('root'));
    window.mountChequeQueue = (permissions = ['cheques:view', 'cheques:create', 'ap-pdc:view']) => {
      localStorage.setItem('userSession', JSON.stringify({
        token: 'browser-fixture-token',
        user: { employee_id: 1, permission_level_id: 10, permissions },
        permissions
      }));
      root.render(
        React.createElement(AuthProvider, { key: Date.now() },
          React.createElement(ChequePrintingPage, {
            onNavigateSection: (sec) => {
              window.__lastNavigatedSection = sec;
            }
          })
        )
      );
    };
  </script>
</body>
</html>
