version: "1.0"

providers:
  gemini:
    enabled: true
    api_key_env: "GEMINI_API_KEY"
    pool_env: "GEMINI_API_KEY_POOL"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
  groq:
    enabled: true
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
  openrouter:
    enabled: true
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
  deepseek:
    enabled: true
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"

pools:
  interactive_parser_pool:
    description: >-
      Paid, user-facing structured extraction. This is intentionally separate
      from free-only background pools so a user-facing request can have a
      reliable paid fallback without background throughput consuming credits.
    confidence_threshold: 0.60
    escalation_pool: "expense_reasoning_pool"
    generation:
      temperature: 0
      max_tokens: 512
      reasoning_effort: none
    fallback_chain:
      - provider: openrouter
        model: "google/gemma-4-26b-a4b-it"
      - provider: openrouter
        model: "qwen/qwen3.8-flash"
      - provider: deepseek
        model: "deepseek-flash"

  expense_reasoning_pool:
    description: >-
      Capped, paid escalation pool for genuinely ambiguous interactive requests.
      It must not be used by high-volume background work.
    generation:
      temperature: 0
      max_tokens: 512
      reasoning_effort: low
    fallback_chain:
      - provider: openrouter
        model: "z-ai/glm-5.3-flash"

  part_deduplication_pool:
    description: >-
      Free-only, retryable background deduplication. Do not add paid candidates
      here: when all free models are unavailable, the worker must leave work for
      a later retry instead of consuming paid credits.
    cost_policy: free_only
    generation:
      temperature: 0
      max_tokens: 256
      reasoning_effort: none
    fallback_chain:
      - provider: openrouter
        model: "google/gemma-4-31b-it:free"
      - provider: openrouter
        model: "google/gemma-4-26b-a4b-it:free"
      - provider: openrouter
        model: "openrouter/free"

  scheduled_bulk_pool:
    description: >-
      Paid catch-up work for an explicitly scheduled queue only. It is not a
      fallback for the free-only dedupe worker.
    generation:
      temperature: 0
      max_tokens: 256
      reasoning_effort: low
    fallback_chain:
      - provider: deepseek
        model: "deepseek-flash"
      - provider: openrouter
        # OpenRouter's :batch endpoint is asynchronous and cannot be called by
        # this synchronous chat-completions adapter. Use the normal model until
        # a dedicated batch-job client is introduced.
        model: "z-ai/glm-5.3-flash"

  vehicle_fitment_parser_pool:
    description: "Paid user-facing vehicle fitment extraction, with a larger JSON-output cap for multiple proposed rows."
    generation:
      temperature: 0
      max_tokens: 1024
      reasoning_effort: none
    fallback_chain:
      - provider: openrouter
        model: "google/gemma-4-26b-a4b-it"
      - provider: openrouter
        model: "qwen/qwen3.8-flash"
      - provider: deepseek
        model: "deepseek-flash"
